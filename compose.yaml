# Local development: the accounts database, and dbmate to apply db/migrations.
# The server runs compose.prod.yaml instead.
#
#   npm run db:up               start Postgres on localhost:5433, apply migrations
#   npm run db:new -- <name>    create db/migrations/<timestamp>_<name>.sql
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      # 5433 so it runs beside an app's own database on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://auth:auth@db:5432/auth?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
