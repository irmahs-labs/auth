name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One job per check, so a pull request lists each one with its own result.
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ultracite
        run: npm run check

  typecheck:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Migrations apply, roll back, and match schema.sql
        run: |
          npm run db:up
          git diff --exit-code db/schema.sql
          for _ in db/migrations/*.sql; do docker compose run --rm migrate --no-dump-schema rollback; done
          docker compose run --rm migrate --no-dump-schema up

      # Better Auth compares its expected tables with the database; anything
      # printed beyond the "nothing to add" line is a missing migration.
      - name: Migrations cover everything Better Auth needs
        env:
          AUTH_URL: http://localhost:3001
          BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
          DATABASE_URL: postgres://auth:auth@localhost:5433/auth
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          TRUSTED_ORIGINS: http://localhost:5173
        run: |
          out=$(npx tsx scripts/schema.ts 2>/dev/null)
          echo "$out"
          test "$out" = "-- nothing to add: the database matches Better Auth"

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate production compose
        run: |
          POSTGRES_PASSWORD=x POSTGRES_PASSWORD_URL=x BETTER_AUTH_SECRET=x GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x \
            docker compose -f compose.prod.yaml config --quiet

      - name: Docker build
        run: docker build -t auth .

  # The branch rules require a check named "checks". It fails if any job
  # above failed, was cancelled or skipped; list new jobs in needs.
  checks:
    name: checks
    if: always()
    needs: [lint, typecheck, test, migrations, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: A job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
